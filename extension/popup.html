<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">🛡️ SafeWeb Jr</div>
  </div>
  
  <div class="card status-card">
    <div class="status-indicator">🟢 Protection Active</div>
    <div class="child-name">Protected Child</div>
  </div>

  <div class="card stats-card">
    <h3>Today's Stats</h3>
    <div class="stat-row">
      <span>Sites visited today:</span>
      <span id="sites-visited">0</span>
    </div>
    <div class="stat-row">
      <span>Flags raised today:</span>
      <span id="flags-raised">0</span>
    </div>
    <div class="stat-row">
      <span>Points earned today:</span>
      <span id="points-earned">0</span>
    </div>
    <div class="stat-row">
      <span>Screen time:</span>
      <span id="screen-time-display">0 mins</span>
    </div>
    <div class="stat-row" style="color: #ef4444;">
      <span>Sites blocked today:</span>
      <span id="sites-blocked">0</span>
    </div>
  </div>

  <button id="panic-btn" class="panic-button">
    <span class="icon">🚨</span>
    <div class="panic-text">
      <strong>Panic Button</strong>
      <span>Press if you see something scary</span>
    </div>
  </button>

  <div class="footer">SafeWeb Jr - Keeping you safe</div>

  <script src="popup.js"></script>
</body>
</html>
